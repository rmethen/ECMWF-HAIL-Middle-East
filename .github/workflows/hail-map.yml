name: Generate Hail Map

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-map:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib cartopy ecmwf-opendata
      - name: Test ECMWF real data download
        run: |
          python ecmwf_hail_data.py
      - name: Generate Middle East hail map
        run: |
          python make_hail_map.py

      - name: Commit generated map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ECMWF_HAIL_INDEX_MIDDLE_EAST_LATEST.png
          git diff --cached --quiet || git commit -m "Update experimental hail map"
          git push
