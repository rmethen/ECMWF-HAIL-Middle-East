name: Generate Hail Map
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hail-map.yml'
      - 'ecmwf_hail_data.py'
      - 'process_hail_grib.py'
      - 'gfs_hail_support.py'
      - 'make_hail_map.py'
      - 'make_snow_map.py'
      - 'combined_hail_map.py'
      - 'lightning_environment_index.py'
      - 'make_lightning_environment_map.py'
  pull_request:
    paths:
      - '.github/workflows/hail-map.yml'
      - 'ecmwf_hail_data.py'
      - 'process_hail_grib.py'
      - 'make_snow_map.py'
  schedule:
    - cron: '17 9,12,21,0 * * *'
  workflow_dispatch:
concurrency:
  group: severe-weather-maps-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generate-map:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib cartopy ecmwf-opendata xarray cfgrib eccodes
      - name: Test ECMWF real data download
        run: |
          python ecmwf_hail_data.py
      - name: Process ECMWF GRIB diagnostics
        if: github.event_name != 'pull_request'
        run: |
          python process_hail_chunks.py
      - name: Generate Middle East hail map
        if: github.event_name != 'pull_request'
        run: |
          python make_hail_map.py
          python make_hail_map_wbz_1500_3000.py
      - name: Generate time-matched ECMWF and GFS agreement map
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python combined_hail_map.py
      - name: Generate Middle East thunderstorm map
        if: github.event_name != 'pull_request'
        run: |
          python make_thunderstorm_map.py
          python make_lightning_environment_map.py
      - name: Generate Middle East dust and wall-storm map
        if: github.event_name != 'pull_request'
        run: |
          python make_dust_map.py
      - name: Generate Middle East snow environment map
        run: |
          python make_snow_map.py ${{ github.event_name == 'pull_request' && '--require-snowfall' || '' }}
      - name: Upload verified snowfall preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ecmwf-snowfall-preview
          path: output/ECMWF_SNOW_ENVIRONMENT_MIDDLE_EAST_LATEST.png
          if-no-files-found: error
      - name: Commit generated map
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/hail_download_status.json output/hail_status.json
          git add output/hail_status.json
          git add output/ECMWF_HAIL_INDEX_MIDDLE_EAST_LATEST.png
          git add output/ECMWF_HAIL_INDEX_WBZ_1500_3000_LATEST.png
          if test -f output/ECMWF_GFS_HAIL_AGREEMENT_LATEST.png; then git add output/ECMWF_GFS_HAIL_AGREEMENT_LATEST.png; fi
          git add output/ECMWF_THUNDERSTORM_LIGHTNING_POTENTIAL_LATEST.png
          git add output/ECMWF_LIGHTNING_ENVIRONMENT_EXPERIMENTAL_LATEST.png
          git add output/ECMWF_DUST_WALL_STORM_POTENTIAL_LATEST.png
          git add output/ECMWF_SNOW_ENVIRONMENT_MIDDLE_EAST_LATEST.png
          git diff --cached --quiet || git commit -m "Update experimental severe-weather maps"
          git pull --rebase origin main
          git push

