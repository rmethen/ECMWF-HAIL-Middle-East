name: Generate GFS Hail Map
on:
  push:
    branches: [main]
    paths:
      - 'gfs_hail_map.py'
      - '.github/workflows/gfs-hail-map.yml'
  schedule:
    - cron: '40 2,8,14,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy matplotlib cartopy xarray cfgrib eccodes
      - run: python gfs_hail_map.py
      - name: Commit map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/GFS_HAIL_INDEX_MIDDLE_EAST_LATEST.png
          git diff --cached --quiet || git commit -m "Update GFS hail environment map"
          git pull --rebase origin main
          git push
