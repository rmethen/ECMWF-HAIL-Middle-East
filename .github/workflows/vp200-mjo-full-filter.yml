name: VP200 Full MJO Filter

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * 4"

permissions:
  contents: write

concurrency:
  group: vp200-mjo-full-filter
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy scipy requests xarray netCDF4 matplotlib cartopy
      - name: Build fully filtered MJO analysis
        run: python vp200_mjo_full_filter.py
      - name: Commit latest fully filtered map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/VP200_MJO_FULL_FILTER_LATEST.png
          git diff --cached --quiet && exit 0
          git commit -m "Update fully filtered MJO VP200 analysis"
          git push
