name: SHIP experimental unit tests
on:
  pull_request:
    paths:
      - 'gfs_ship_map.py'
      - 'gfs_ship_inputs.py'
      - 'test_gfs_ship_map.py'
      - 'test_gfs_ship_inputs.py'
      - '.github/workflows/ship-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ship-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install numpy
      - name: Run SHIP numerical and request tests
        run: python -m unittest -v test_gfs_ship_map test_gfs_ship_inputs
