name: Experimental Ensemble Scenarios

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gefs-rainfall:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev proj-data proj-bin
          python -m pip install --upgrade pip
          pip install numpy requests xarray cfgrib eccodes matplotlib cartopy
      - name: Download all GEFS precipitation members
        run: python gefs_ensemble_precip.py
      - name: Generate agreement and extreme-scenario maps
        run: python make_ensemble_precip_maps.py
      - name: Commit experimental ensemble products
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/GEFS_PRECIP_ENSEMBLE_AGREEMENT_0_72H_LATEST.png
          git add output/GEFS_PRECIP_WETTEST_MEMBER_0_72H_LATEST.png
          git add output/ensemble_status.json
          git diff --cached --quiet || git commit -m "Update experimental GEFS ensemble rainfall maps"
          git push
