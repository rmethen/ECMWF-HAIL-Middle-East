name: NCICS OLR CFS MJO Wave Map

on:
  workflow_dispatch:
  schedule:
    - cron: "35 5 * * *"

permissions:
  contents: write

concurrency:
  group: ncics-mjo-wave-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Fetch latest NCICS map
        run: python fetch_ncics_mjo.py
      - name: Commit latest map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/NCICS_OLR_CFS_MJO_WAVES_LATEST.png
          git diff --cached --quiet && exit 0
          git commit -m "Update NCICS OLR CFS MJO wave map"
          git pull --rebase origin main
          git push
